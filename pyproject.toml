[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medwave-brain"
version = "0.1.0"
description = "MedWave manager brain: Obsidian vault plus a local-first CLI for Master Control."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
headroom = ["headroom-ai"]
dev = ["pytest"]

[project.scripts]
brain = "brain.cli:main"

[tool.setuptools.packages.find]
include = ["brain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
